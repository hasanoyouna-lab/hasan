name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة وحدة بس بنفس الوقت. النشرات المتوازية كانت تلغي بعضها
# ("Deployment cancelled") وتخلي الموقع عالق على نسخة قديمة.
# cancel-in-progress: false يعني الرفعة الجديدة تستنى دورها بدل ما تقتل اللي قبلها.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
